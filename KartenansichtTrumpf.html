<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TTCG – Trumpfkarte</title>

    <link rel="stylesheet" href="trumpf-karte.css">
</head>

<body>

    <div class="trumpf-card">

    <div class="card-name">
        Max Mustermann
    </div>

    <div class="card-image">
        <img src="bilder/lehrer.jpg" alt="Bild der Lehrkraft">
    </div>

    <div class="section-title">
        Eigenschaften
    </div>

    <div class="card-properties">

        <button class="property-button" type="button">
            <span class="property-name">Humor</span>
            <span class="property-value">80</span>
        </button>

        <button class="property-button" type="button">
            <span class="property-name">Strenge</span>
            <span class="property-value">65</span>
        </button>

        <button class="property-button" type="button">
            <span class="property-name">Kaffeekonsum</span>
            <span class="property-value">90</span>
        </button>

        <button class="property-button" type="button">
            <span class="property-name">Pünktlichkeit</span>
            <span class="property-value">45</span>
        </button>

    </div>

    <div class="section-title">
        Effekt
    </div>

    <div class="card-text">
        Wenn diese Karte ausgespielt wird, steigt der Kaffeekonsum
        aller Lehrkräfte im Lehrerzimmer erheblich.
    </div>

</div>

</body>

</html>
