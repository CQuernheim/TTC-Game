services:
  app:
    build: .
    volumes:
      - ..:/workspace:cached,z
    command: php -S 0.0.0.0:8080 -t /workspace
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - webprog

  db:
    image: mariadb:11
    # Kein restart: unless-stopped, damit er bei Fehlern nicht in Dauerschleifen gerät
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: webprog
      MARIADB_USER: webprog
      MARIADB_PASSWORD: webprog
    ports:
      - "3306:3306"
    # Schneller flüchtiger Speicher im RAM (nicht persistent):
    tmpfs:
      - /var/lib/mysql
    volumes:
      # Wichtig: direkt in den Ordner mounten, nicht in einen Unterordner
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - webprog

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - webprog

networks:
  webprog:
    ipam:
      config:
        - subnet: 172.28.0.0/24