<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klassenkampf – Ergebnis</title>
  <link rel="stylesheet" href="dashboard.css">
</head>

<body>

  <div class="result-page">

    <div class="result-box">

      <h1 id="result-title">
        Spiel beendet
      </h1>

      <div class="winner">
        🏆
        <span id="winner-text">Gewinner</span>
      </div>

      <div class="score">
        <div>
          <span id="player1-name">Spieler 1</span>
          <strong id="player1-score">0</strong>
        </div>

        <div class="versus">
          :
        </div>

        <div>
          <span id="player2-name">Spieler 2</span>
          <strong id="player2-score">0</strong>
        </div>
      </div>

      <div class="result-actions">

        <button
          class="result-button again"
          onclick="playAgain()"
        >
          🔄 NOCHMAL SPIELEN
        </button>

        <button
          class="result-button menu"
          onclick="backToMenu()"
        >
          ⌂ ZUR SPIELAUSWAHL
        </button>

      </div>

    </div>

  </div>


  <script>

    const params = new URLSearchParams(window.location.search);

    const modus = params.get("modus");


    /* Spielform anzeigen */

    if (modus === "A") {

      document.getElementById("result-title").textContent =
        "Karten-Trumpf – Ergebnis";

    }

    if (modus === "B") {

      document.getElementById("result-title").textContent =
        "Kartenkampf 1:1 – Ergebnis";

    }


    /* Diese Werte werden später vom eigentlichen Spiel übergeben */

    const winner = params.get("winner");
    const score1 = params.get("score1");
    const score2 = params.get("score2");


    if (winner) {
      document.getElementById("winner-text").textContent =
        winner;
    }

    if (score1) {
      document.getElementById("player1-score").textContent =
        score1;
    }

    if (score2) {
      document.getElementById("player2-score").textContent =
        score2;
    }


    /* Nochmal spielen */

    function playAgain() {

      if (modus === "A" || modus === "B") {

        window.location.href =
          "spiel.html?modus=" + modus;

      }

    }


    /* Zurück zur Auswahl */

    function backToMenu() {

      window.location.href =
        "dashboard.html";

    }

  </script>

</body>

</html>
