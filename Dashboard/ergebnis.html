<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Klassenkampf – Ergebnis</title>

  <link rel="stylesheet" href="dashboard.css">
</head>

<body>

  <main class="result-page">

    <section class="result-box">

      <div class="result-mode" id="resultMode">
        Spiel beendet
      </div>

      <h1>🏆 Gewinner 🏆</h1>

      <div class="winner" id="winner">
        Spieler 1
      </div>

      <div class="score">

        <div class="score-player">
          <span>Spieler 1</span>
          <strong id="score1">10</strong>
        </div>

        <div class="versus">
          VS
        </div>

        <div class="score-player">
          <span>Spieler 2</span>
          <strong id="score2">8</strong>
        </div>

      </div>

      <div class="result-actions">

        <button
          class="result-button again"
          onclick="playAgain()">
          🔄 NOCHMAL SPIELEN
        </button>

        <button
          class="result-button menu"
          onclick="goToMenu()">
          ⌂ ZUR SPIELAUSWAHL
        </button>

      </div>

    </section>

  </main>


  <script>

    const params = new URLSearchParams(window.location.search);

    const modus = params.get("modus");


    if (modus === "A") {

      document.getElementById("resultMode").textContent =
        "Spiel beendet · Karten-Trumpf";

    }

    if (modus === "B") {

      document.getElementById("resultMode").textContent =
        "Spiel beendet · Kartenkampf 1:1";

    }


    function playAgain() {

      if (modus === "A") {
        window.location.href = "../SpielfeldTrumpf.php";
      }

      if (modus === "B") {
        window.location.href = "../SpielfeldKampf.php";
      }

    }


    function goToMenu() {

      window.location.href = "dashboard.html";

    }

  </script>

</body>

</html>
